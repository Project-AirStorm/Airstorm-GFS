services:
  backend:
    build: ./backend
    ports:
      - "80:5000"  # Changed to port 80 for public HTTP access
    volumes:
      - ./backend:/app
    environment:
      - FLASK_ENV=production  # Changed to production
      - FLASK_DEBUG=0  # Disabled debug mode for security
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"  # This is fine if you want direct access to React
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=0
