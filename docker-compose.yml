services:
  backend:
    env_file: 
      - .env
    build: ./backend
    ports:
      - "5001:5000"
    volumes:
      - ./backend:/app
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - GOOGLE_MAPS_API_KEY=${BACKEND_GOOGLE_MAPS_API_KEY}
      - METEOMATICS_USERNAME=${BACKEND_METEOMATICS_USERNAME}
      - METEOMATICS_PASSWORD=${BACKEND_METEOMATICS_PASSWORD}

  frontend:
    env_file: 
      - .env
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=0
      - MAPTILER_KEY=${REACT_MAPTILER_KEY}
      - MAPTILER_API_KEY=${REACT_MAPTILER_API_KEY}
      - USER_ID=${REACT_USER_ID}
      - GOOGLE_MAPS_API_KEY=${REACT_GOOGLE_MAPS_API_KEY}