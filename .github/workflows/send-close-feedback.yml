# File: send-close-feedback.yml
name: Handle Feedback Ticket Closure

on:
  issues:
    types: [closed]

jobs:
  send-internal-notification:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'user-feedback')
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Extract ticket metadata
        id: extract-metadata
        uses: actions/github-script@v7
        with:
          script: |
            const issueBody = context.payload.issue.body;
            const nameMatch = issueBody.match(/\*\*Name:\*\*\s*([\s\S]+?)(?=\*\*|$)/u);
            const emailMatch = issueBody.match(/\*\*Email:\*\*\s*([\s\S]+?)(?=\*\*|$)/u);
            const feedbackMatch = issueBody.match(/### Feedback Details\s*([\s\S]+)$/u);
            
            const name = nameMatch ? Buffer.from(nameMatch[1].trim()).toString('base64') : 'Anonymous User';
            const email = emailMatch ? Buffer.from(emailMatch[1].trim()).toString('base64') : 'No email provided';
            const feedbackDetails = feedbackMatch ? Buffer.from(feedbackMatch[1].trim()).toString('base64') : 'No details provided';
            
            const submissionDate = new Date(context.payload.issue.created_at);
            const closureDate = new Date(context.payload.issue.closed_at);
            
            const resolutionTime = Math.floor((closureDate - submissionDate) / (1000 * 60 * 60));
            let resolutionTimeText;
            if (resolutionTime < 24) {
                resolutionTimeText = `${resolutionTime} hours`;
            } else {
                const days = Math.floor(resolutionTime / 24);
                const remainingHours = resolutionTime % 24;
                resolutionTimeText = `${days} days, ${remainingHours} hours`;
            }
            
            core.setOutput('submitter_name_base64', name);
            core.setOutput('submitter_email_base64', email);
            core.setOutput('issue_title_base64', Buffer.from(context.payload.issue.title).toString('base64'));
            core.setOutput('issue_number', context.payload.issue.number);
            core.setOutput('feedback_details_base64', feedbackDetails);
            core.setOutput('submission_date', submissionDate.toLocaleDateString('en-US', {
              weekday: 'long',
              year: 'numeric',
              month: 'long',
              day: 'numeric',
              hour: '2-digit',
              minute: '2-digit'
            }));
            core.setOutput('closure_date', closureDate.toLocaleDateString('en-US', {
              weekday: 'long',
              year: 'numeric',
              month: 'long',
              day: 'numeric',
              hour: '2-digit',
              minute: '2-digit'
            }));
            core.setOutput('resolution_time', resolutionTimeText);
            core.setOutput('issue_url', context.payload.issue.html_url);

      - name: Prepare internal email content
        run: |
          # Decode base64 values
          NAME=$(echo "${{ steps.extract-metadata.outputs.submitter_name_base64 }}" | base64 -d)
          EMAIL=$(echo "${{ steps.extract-metadata.outputs.submitter_email_base64 }}" | base64 -d)
          TITLE=$(echo "${{ steps.extract-metadata.outputs.issue_title_base64 }}" | base64 -d)
          FEEDBACK=$(echo "${{ steps.extract-metadata.outputs.feedback_details_base64 }}" | base64 -d)
          
          # Read the template
          template=$(cat .github/email-templates/internal-close-notification.html)
          
          # Create JSON with all variables and template replacement
          jq -n \
            --arg name "$NAME" \
            --arg email "$EMAIL" \
            --arg title "$TITLE" \
            --arg number "${{ steps.extract-metadata.outputs.issue_number }}" \
            --arg submission_date "${{ steps.extract-metadata.outputs.submission_date }}" \
            --arg closure_date "${{ steps.extract-metadata.outputs.closure_date }}" \
            --arg resolution_time "${{ steps.extract-metadata.outputs.resolution_time }}" \
            --arg feedback "$FEEDBACK" \
            --arg issue_url "${{ steps.extract-metadata.outputs.issue_url }}" \
            --arg template "$template" \
            '
            def replace_vars($str):
              $str | gsub("\\{\\{name\\}\\}"; $name) |
                    gsub("\\{\\{email\\}\\}"; $email) |
                    gsub("\\{\\{issue_number\\}\\}"; $number) |
                    gsub("\\{\\{issue_title\\}\\}"; $title) |
                    gsub("\\{\\{submission_date\\}\\}"; $submission_date) |
                    gsub("\\{\\{closure_date\\}\\}"; $closure_date) |
                    gsub("\\{\\{resolution_time\\}\\}"; $resolution_time) |
                    gsub("\\{\\{feedback_details\\}\\}"; $feedback) |
                    gsub("\\{\\{issue_url\\}\\}"; $issue_url);
            
            {
              "Subject": {
                "Data": "[Support Ticket Closed] \($title) (#\($number))",
                "Charset": "UTF-8"
              },
              "Body": {
                "Html": {
                  "Data": replace_vars($template),
                  "Charset": "UTF-8"
                }
              }
            }' > message.json

      - name: Send internal notification
        run: |
          aws ses send-email \
            --from "support@projectairstorm.com" \
            --destination "ToAddresses=support@projectairstorm.com,francisj24@lsus.edu,mataa98@lsus.edu,gafforde82@lsus.edu,zittrauerc49@lsus.edu,khawaldehd68@lsus.edu,hartlinev49@lsus.edu" \
            --message file://message.json
  
  send-external-notification:
    needs: send-internal-notification
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'user-feedback')
    steps:
      - uses: actions/checkout@v4
      # Similar modifications as above for external notification
      
      - name: Extract email metadata
        id: extract-metadata
        uses: actions/github-script@v7
        with:
          script: |
            const issueBody = context.payload.issue.body;
            // Use safer regex with unicode support
            const nameMatch = issueBody.match(/\*\*Name:\*\*\s*([\s\S]+?)(?=\*\*|$)/u);
            const emailMatch = issueBody.match(/\*\*Email:\*\*\s*([\s\S]+?)(?=\*\*|$)/u);
            
            // Base64 encode the extracted data
            const name = nameMatch ? Buffer.from(nameMatch[1].trim()).toString('base64') : 'User';
            const email = emailMatch ? Buffer.from(emailMatch[1].trim()).toString('base64') : '';
            
            // Format dates
            const submissionDate = new Date(context.payload.issue.created_at)
              .toLocaleDateString('en-US', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
              });
            
            const closureDate = new Date(context.payload.issue.closed_at)
              .toLocaleDateString('en-US', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
              });
            
            core.setOutput('recipient_email_base64', email);
            core.setOutput('recipient_name_base64', name);
            core.setOutput('issue_title_base64', Buffer.from(context.payload.issue.title).toString('base64'));
            core.setOutput('issue_number', context.payload.issue.number);
            core.setOutput('submission_date', submissionDate);
            core.setOutput('closure_date', closureDate);

      - name: Send closure email
        run: |
          # Decode base64 values
          EMAIL=$(echo "${{ steps.extract-metadata.outputs.recipient_email_base64 }}" | base64 -d)
          NAME=$(echo "${{ steps.extract-metadata.outputs.recipient_name_base64 }}" | base64 -d)
          TITLE=$(echo "${{ steps.extract-metadata.outputs.issue_title_base64 }}" | base64 -d)
          
          # Read and process the closure template
          template=$(cat .github/email-templates/external-feedback-close.html)
          
          # Create JSON message with proper escaping and template replacement
          jq -n \
            --arg name "$NAME" \
            --arg email "$EMAIL" \
            --arg title "$TITLE" \
            --arg number "${{ steps.extract-metadata.outputs.issue_number }}" \
            --arg submission_date "${{ steps.extract-metadata.outputs.submission_date }}" \
            --arg closure_date "${{ steps.extract-metadata.outputs.closure_date }}" \
            --arg template "$template" \
            '
            def replace_vars($str):
              $str | gsub("\\{\\{name\\}\\}"; $name) |
                    gsub("\\{\\{issue_number\\}\\}"; $number) |
                    gsub("\\{\\{issue_title\\}\\}"; $title) |
                    gsub("\\{\\{submission_date\\}\\}"; $submission_date) |
                    gsub("\\{\\{closure_date\\}\\}"; $closure_date) |
                    gsub("\\{\\{resolution_comment\\}\\}"; "This ticket has been reviewed and resolved.");
            
            {
              "Subject": {
                "Data": "[Project AirStorm Support] Ticket Closed: \($title) [Issue: #\($number)]",
                "Charset": "UTF-8"
              },
              "Body": {
                "Html": {
                  "Data": replace_vars($template),
                  "Charset": "UTF-8"
                },
                "Text": {
                  "Data": "Dear \($name),\n\nYour feedback ticket has been resolved and closed. Thank you for helping us improve Project Airstorm!\n\nTicket Summary:\nReference #: \($number)\nSubject: \($title)\nSubmitted: \($submission_date)\nClosed: \($closure_date)\n\nResolution Notes:\nThis ticket has been reviewed and resolved.\n\nWe appreciate your input and involvement in making Project Airstorm better. If you have any other feedback or concerns in the future, please do not hesitate to reach out.\n\nBest regards,\nProject Airstorm Support Team",
                  "Charset": "UTF-8"
                }
              }
            }' > message.json
            
          # Send the email using the prepared message
          aws ses send-email \
            --from "support@projectairstorm.com" \
            --destination "ToAddresses=$EMAIL" \
            --message file://message.json
