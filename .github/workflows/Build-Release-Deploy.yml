name: Build, Release and Deploy
on:
  push:
    branches:
      - dev
permissions:
  contents: write
  actions: write

jobs:
  version-bump:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    
    outputs:
      new_version: ${{ steps.bump_version.outputs.new_version }}
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.BACKEND_GITHUB_ACCESS_TOKEN }}
          repository: Project-AirStorm/Airstorm-GFS
          
      - name: Get latest version
        id: get_version
        env:
          GITHUB_TOKEN: ${{ secrets.BACKEND_GITHUB_ACCESS_TOKEN }}
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0")
          echo "LATEST_TAG=${LATEST_TAG}" >> $GITHUB_ENV
          
      - name: Bump version
        id: bump_version
        run: |
          CURRENT_VERSION=${LATEST_TAG#v}
          IFS='.' read -r -a version_parts <<< "$CURRENT_VERSION"
          MINOR=$((${version_parts[1]} + 1))
          NEW_VERSION="0.${MINOR}"
          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "NEW_VERSION=${NEW_VERSION}" >> $GITHUB_ENV

      - name: Create tag
        env:
          GITHUB_TOKEN: ${{ secrets.BACKEND_GITHUB_ACCESS_TOKEN }}
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git tag -a "v${NEW_VERSION}" -m "Release version ${NEW_VERSION}"
          git push origin "v${NEW_VERSION}"

  generate-notes:
    needs: version-bump
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.BACKEND_GITHUB_ACCESS_TOKEN }}
          repository: Project-AirStorm/Airstorm-GFS
          
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install axios
          
      - name: Get commit messages
        id: get_commits
        env:
          GITHUB_TOKEN: ${{ secrets.BACKEND_GITHUB_ACCESS_TOKEN }}
        run: |
          # Get all commits since last tag for both frontend and backend
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "v${{ needs.version-bump.outputs.new_version }}^" 2>/dev/null || echo "")
          
          echo "Frontend changes:" > changes.txt
          git log ${PREVIOUS_TAG}..HEAD --oneline -- frontend >> changes.txt
          
          echo -e "\nBackend changes:" >> changes.txt
          git log ${PREVIOUS_TAG}..HEAD --oneline -- backend >> changes.txt
          
          # Escape content for JSON
          CHANGES=$(cat changes.txt | jq -sRr @json)
          echo "changes=${CHANGES}" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: generate_notes
        uses: actions/github-script@v6
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COMMITS: ${{ steps.get_commits.outputs.changes }}
        with:
          script: |
            const axios = require('axios');
            
            const prompt = `You are a technical writer creating release notes. 
            Please analyze these git commits and create professional, well-organized release notes.
            Group changes by frontend and backend, and within those by feature additions, improvements, and bug fixes.
            Use clear, concise language and proper markdown formatting.
            
            Here are the commits:
            ${process.env.COMMITS}`;
            
            const response = await axios.post('https://generativelanguage.googleapis.com/v1/models/gemini-pro:generateContent', {
              contents: [{
                parts: [{
                  text: prompt
                }]
              }],
              generationConfig: {
                maxOutputTokens: 1024,
                temperature: 0.7
              }
            }, {
              headers: {
                'Content-Type': 'application/json',
                'x-goog-api-key': process.env.GEMINI_API_KEY
              }
            });
            
            const releaseNotes = response.data.candidates[0].content.parts[0].text;
            core.setOutput('notes', releaseNotes);

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.version-bump.outputs.new_version }}
          name: Release v${{ needs.version-bump.outputs.new_version }}
          body: ${{ steps.generate_notes.outputs.notes }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.BACKEND_GITHUB_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.BACKEND_GITHUB_ACCESS_TOKEN }}

  deploy:
    needs: [version-bump, generate-notes]
    name: Deploy
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: us-east-1
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.AWS_SSH_KEY }}
          debug: true
          script: |
            # Print initial disk space
            echo "Initial disk space:"
            df -h /
            # Aggressive Docker cleanup
            echo "Performing Docker cleanup..."
            docker system prune -af --volumes
            docker volume rm $(docker volume ls -q) || true
            # Stop and remove all running containers
            echo "Stopping and removing containers..."
            docker stop $(docker ps -a -q) || true
            docker rm $(docker ps -a -q) || true
            # Remove all images
            echo "Removing Docker images..."
            docker rmi -f $(docker images -aq) || true
            # Print disk space after cleanup
            echo "Disk space after cleanup:"
            df -h /
            cd ~/production/Airstorm-GFS
            git pull
            # Create .env file from GitHub Secrets
            echo "Creating .env file..."
            cat > .env << EOL
            BACKEND_GOOGLE_MAPS_API_KEY=${{ secrets.BACKEND_GOOGLE_MAPS_API_KEY }}
            BACKEND_METEOMATICS_USERNAME=${{ secrets.BACKEND_METEOMATICS_USERNAME }}
            BACKEND_METEOMATICS_PASSWORD=${{ secrets.BACKEND_METEOMATICS_PASSWORD }}
            REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}
            REACT_APP_MAPTILER_KEY=${{ secrets.REACT_APP_MAPTILER_KEY }}
            REACT_APP_MAPTILER_API_KEY=${{ secrets.REACT_APP_MAPTILER_API_KEY }}
            REACT_APP_USER_ID=${{ secrets.REACT_APP_USER_ID }}
            REACT_APP_GOOGLE_MAPS_API_KEY=${{ secrets.REACT_APP_GOOGLE_MAPS_API_KEY }}
            REACT_APP_VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.REACT_APP_VITE_CLERK_PUBLISHABLE_KEY }}
            BACKEND_GITHUB_ACCESS_TOKEN=${{ secrets.BACKEND_GITHUB_ACCESS_TOKEN }}
            BACKEND_GITHUB_OWNER=${{ secrets.BACKEND_GITHUB_OWNER }}
            BACKEND_GITHUB_REPO=${{ secrets.BACKEND_GITHUB_REPO }}
            EOL
            # Verify .env file was created
            if [ ! -f .env ]; then
              echo "Error: .env file was not created"
              exit 1
            fi
            echo "Building and starting containers..."
            docker-compose up -d --build
            # Verify containers are running
            echo "Checking container status:"
            docker ps
            echo "Deployment complete"
