            --arg date "${{ steps.extract-metadata.outputs.submission_date }}" \
            --arg feedback "$FEEDBACK" \
            --arg template "$template" \
            '
            def replace_vars($str):
              $str | gsub("\\{\\{name\\}\\}"; $name) |
                    gsub("\\{\\{issue_number\\}\\}"; $number) |
                    gsub("\\{\\{issue_title\\}\\}"; $title) |
