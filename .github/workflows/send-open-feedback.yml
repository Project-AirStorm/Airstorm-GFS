# File: send-open-feedback.yml
name: Handle User Feedback Emails (Open)

on:
  issues:
    types: [opened]

jobs:
  send-internal-notification:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'user-feedback')
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Extract metadata
        id: extract-metadata
        uses: actions/github-script@v7
        with:
          script: |
            const issueBody = context.payload.issue.body;
            // Use safer regex patterns with unicode support
            const nameMatch = issueBody.match(/\*\*Name:\*\*\s*([\s\S]+?)(?=\*\*|$)/u);
            const emailMatch = issueBody.match(/\*\*Email:\*\*\s*([\s\S]+?)(?=\*\*|$)/u);
            const feedbackMatch = issueBody.match(/### Feedback Details\s*([\s\S]+)$/u);
            
            // Encode the extracted data to handle special characters
            const name = nameMatch ? Buffer.from(nameMatch[1].trim()).toString('base64') : 'Anonymous User';
            const email = emailMatch ? Buffer.from(emailMatch[1].trim()).toString('base64') : '';
            const feedbackDetails = feedbackMatch ? Buffer.from(feedbackMatch[1].trim()).toString('base64') : '';
            
            const date = new Date().toLocaleDateString('en-US', {
              weekday: 'long',
              year: 'numeric',
              month: 'long',
              day: 'numeric'
            });
            
            core.setOutput('recipient_email_base64', email);
            core.setOutput('recipient_name_base64', name);
            core.setOutput('issue_title_base64', Buffer.from(context.payload.issue.title).toString('base64'));
            core.setOutput('issue_number', context.payload.issue.number);
            core.setOutput('feedback_details_base64', feedbackDetails);
            core.setOutput('submission_date', date);

      - name: Decode and prepare email
        run: |
          # Decode base64 encoded values
          NAME=$(echo "${{ steps.extract-metadata.outputs.recipient_name_base64 }}" | base64 -d)
          EMAIL=$(echo "${{ steps.extract-metadata.outputs.recipient_email_base64 }}" | base64 -d)
          TITLE=$(echo "${{ steps.extract-metadata.outputs.issue_title_base64 }}" | base64 -d)
          FEEDBACK=$(echo "${{ steps.extract-metadata.outputs.feedback_details_base64 }}" | base64 -d)
          
          # Read and process the template
          template=$(cat .github/email-templates/external-feedback-open.html)
          
          # Create JSON message with proper escaping and template replacement
          jq -n \
            --arg name "$NAME" \
            --arg email "$EMAIL" \
            --arg title "$TITLE" \
            --arg number "${{ steps.extract-metadata.outputs.issue_number }}" \
            --arg date "${{ steps.extract-metadata.outputs.submission_date }}" \
            --arg feedback "$FEEDBACK" \
            --arg template "$template" \
            '
            def replace_vars($str):
              $str | gsub("\\{\\{name\\}\\}"; $name) |
                    gsub("\\{\\{issue_number\\}\\}"; $number) |
                    gsub("\\{\\{issue_title\\}\\}"; $title) |
                    gsub("\\{\\{submission_date\\}\\}"; $date) |
                    gsub("\\{\\{feedback_details\\}\\}"; $feedback);
            
            {
              "Subject": {
                "Data": "[Project AirStorm Support] \($title) [Issue: #\($number)]",
                "Charset": "UTF-8"
              },
              "Body": {
                "Html": {
                  "Data": replace_vars($template),
                  "Charset": "UTF-8"
                },
                "Text": {
                  "Data": "Dear \($name),\n\nThank you for reaching out to Project Airstorm Support. We have received your feedback and our team will review it promptly.\n\nTicket Details:\nReference #: \($number)\nSubject: \($title)\nSubmitted: \($date)\n\nYour Feedback:\n\($feedback)\n\nOur team will evaluate your feedback and respond if additional information is needed. You will receive an update via email when this ticket is closed.\n\nBest regards,\nProject Airstorm Support Team",
                  "Charset": "UTF-8"
                }
              }
            }' > message.json

      - name: Send internal notification
        run: |
          aws ses send-email \
            --from "support@projectairstorm.com" \
            --destination "ToAddresses=support@projectairstorm.com,francisj24@lsus.edu,mataa98@lsus.edu,gafforde82@lsus.edu,zittrauerc49@lsus.edu,khawaldehd68@lsus.edu,hartlinev49@lsus.edu" \
            --message file://message.json

  send-external-notification:
    needs: send-internal-notification
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'user-feedback')
    steps:
