name: Send Open Feedback

on:
  issues:
    types: [opened]

jobs:
  internal-notification:
    name: 🏠 Internal Team Notification
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'user-feedback')
    
    permissions:
      issues: read
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Extract metadata
        id: extract-metadata
        uses: actions/github-script@v7
        with:
          script: |
            const issueBody = context.payload.issue.body;
            const nameMatch = issueBody.match(/\*\*Name:\*\* ([^\n]+)/);
            const emailMatch = issueBody.match(/\*\*Email:\*\* ([^\n]+)/);
            const feedbackMatch = issueBody.match(/### Feedback Details\n([\s\S]+?)(\n\n|$)/);
            
            const name = nameMatch ? nameMatch[1].trim() : 'Anonymous User';
            const email = emailMatch ? emailMatch[1].trim() : 'No email provided';
            const feedbackDetails = feedbackMatch ? feedbackMatch[1].trim() : issueBody;
            
            core.setOutput('submitter_name', name);
            core.setOutput('submitter_email', email);
            core.setOutput('issue_title', context.payload.issue.title);
            core.setOutput('issue_number', context.payload.issue.number);
            core.setOutput('feedback_details', feedbackDetails);
            core.setOutput('issue_url', context.payload.issue.html_url);

      - name: Prepare internal email
        id: prepare-internal-email
        run: |
          # Escape all values using jq
          SUBJECT_NAME=$(echo '${{ steps.extract-metadata.outputs.submitter_name }}' | jq -Rs .)
          SUBJECT_EMAIL=$(echo '${{ steps.extract-metadata.outputs.submitter_email }}' | jq -Rs .)
          FEEDBACK=$(echo '${{ steps.extract-metadata.outputs.feedback_details }}' | jq -Rs .)
          
          # Read and escape template
          TEMPLATE=$(cat .github/email-templates/internal-open-notification.html | jq -Rs .)
          
          # Generate JSON payload
          echo '{
            "Subject": {
              "Data": "[New Support Ticket] \(${{ steps.extract-metadata.outputs.issue_title }} | @json) [Issue: #\(${{ steps.extract-metadata.outputs.issue_number }})]",
              "Charset": "UTF-8"
            },
            "Body": {
              "Html": {
                "Data": '"$TEMPLATE"',
                "Charset": "UTF-8"
              }
            }
          }' | jq --arg name "$SUBJECT_NAME" \
                   --arg email "$SUBJECT_EMAIL" \
                   --arg number "${{ steps.extract-metadata.outputs.issue_number }}" \
                   --arg title "$(echo '${{ steps.extract-metadata.outputs.issue_title }}' | jq -Rs .)" \
                   --arg feedback "$FEEDBACK" \
                   --arg url "${{ steps.extract-metadata.outputs.issue_url }}" \
                   '.Body.Html.Data |= gsub("{{name}}"; $name) | 
                    .Body.Html.Data |= gsub("{{email}}"; $email) |
                    .Body.Html.Data |= gsub("{{issue_number}}"; $number) |
                    .Body.Html.Data |= gsub("{{issue_title}}"; $title) |
                    .Body.Html.Data |= gsub("{{feedback_details}}"; $feedback) |
                    .Body.Html.Data |= gsub("{{issue_url}}"; $url)' > message.json

      - name: Send internal notification
        run: |
          aws ses send-email \
            --from "support@projectairstorm.com" \
            --destination "ToAddresses=support@projectairstorm.com,francisj24@lsus.edu,mataa98@lsus.edu,gafforde82@lsus.edu,zittrauerc49@lsus.edu,khawaldehd68@lsus.edu,hartlinev49@lsus.edu" \
            --message file://message.json

  external-confirmation:
    name: 📧 Customer Confirmation
    runs-on: ubuntu-latest
    needs: internal-notification
    if: contains(github.event.issue.labels.*.name, 'user-feedback')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Extract customer metadata
        id: extract-customer
        uses: actions/github-script@v7
        with:
          script: |
            const issueBody = context.payload.issue.body;
            const nameMatch = issueBody.match(/\*\*Name:\*\* ([^\n]+)/);
            const emailMatch = issueBody.match(/\*\*Email:\*\* ([^\n]+)/);
            
            core.setOutput('recipient_email', emailMatch ? emailMatch[1].trim() : '');
            core.setOutput('recipient_name', nameMatch ? nameMatch[1].trim() : 'User');
            core.setOutput('issue_title', context.payload.issue.title);
            core.setOutput('issue_number', context.payload.issue.number);

      - name: Prepare customer email
        id: prepare-customer-email
        run: |
          # Escape all values
          CUSTOMER_NAME=$(echo '${{ steps.extract-customer.outputs.recipient_name }}' | jq -Rs .)
          TEMPLATE=$(cat .github/email-templates/external-feedback-open.html | jq -Rs .)
          
          echo '{
            "Subject": {
              "Data": "[Project AirStorm Support] \(${{ steps.extract-customer.outputs.issue_title }} | @json) [Issue: #\(${{ steps.extract-customer.outputs.issue_number }})]",
              "Charset": "UTF-8"
            },
            "Body": {
              "Html": {
                "Data": '"$TEMPLATE"',
                "Charset": "UTF-8"
              },
              "Text": {
                "Data": "Dear \($CUSTOMER_NAME),\n\nThank you for your feedback...",
                "Charset": "UTF-8"
              }
            }
          }' | jq --arg name "$CUSTOMER_NAME" \
                   --arg number "${{ steps.extract-customer.outputs.issue_number }}" \
                   --arg title "$(echo '${{ steps.extract-customer.outputs.issue_title }}' | jq -Rs .)" \
                   '.Body.Html.Data |= gsub("{{name}}"; $name) |
                    .Body.Html.Data |= gsub("{{issue_number}}"; $number) |
                    .Body.Html.Data |= gsub("{{issue_title}}"; $title)' > customer-message.json

      - name: Send customer email
        run: |
          aws ses send-email \
            --from "support@projectairstorm.com" \
            --destination "ToAddresses=${{ steps.extract-customer.outputs.recipient_email }}" \
            --message file://customer-message.json
