                  "Charset": "UTF-8"
                },
                "Text": {
                  "Data": "Dear \($name),\n\nThank you for reaching out to Project Airstorm Support. We have received your feedback and our team will review it promptly.\n\nTicket Details:\nReference #: \($number)\nSubject: \($title)\nSubmitted: \($date)\n\nYour Feedback:\n\($feedback)\n\nOur team will evaluate your feedback and respond if additional information is needed. You will receive an update via email when this ticket is closed.\n\nBest regards,\nProject Airstorm Support Team",
                  "Charset": "UTF-8"
                }
              }
            }' > message.json

      - name: Send external notification
        run: |
          EMAIL=$(echo "${{ steps.extract-metadata.outputs.recipient_email_base64 }}" | base64 -d)
          aws ses send-email \
            --from "support@projectairstorm.com" \
            --destination "ToAddresses=$EMAIL" \
            --message file://message.json
