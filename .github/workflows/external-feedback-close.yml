name: Handle Feedback Ticket Closure

on:
  issues:
    types: [closed]

jobs:
  send-closure-email:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'user-feedback')
    
    permissions:
      issues: read
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Extract email metadata
        id: extract-metadata
        uses: actions/github-script@v7
        with:
          script: |
            const issueBody = context.payload.issue.body;
            const nameMatch = issueBody.match(/\*\*Name:\*\* ([^\n]+)/);
            const emailMatch = issueBody.match(/\*\*Email:\*\* ([^\n]+)/);
            
            const name = nameMatch ? nameMatch[1].trim() : 'User';
            const email = emailMatch ? emailMatch[1].trim() : '';
            
            // Format dates
            const submissionDate = new Date(context.payload.issue.created_at)
              .toLocaleDateString('en-US', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
              });
            
            const closureDate = new Date(context.payload.issue.closed_at)
              .toLocaleDateString('en-US', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
              });
            
            // Get the last comment as resolution notes
            const resolutionComment = context.payload.issue.comments > 0 
              ? 'This ticket has been reviewed and resolved.' 
              : 'This ticket has been reviewed and resolved.';
            
            core.setOutput('recipient_email', email);
            core.setOutput('recipient_name', name);
            core.setOutput('issue_title', context.payload.issue.title);
            core.setOutput('issue_number', context.payload.issue.number);
            core.setOutput('submission_date', submissionDate);
            core.setOutput('closure_date', closureDate);
            core.setOutput('resolution_comment', resolutionComment);

      - name: Prepare email content
        id: email-content
        run: |
          template=$(cat .github/email-templates/support-closure.html)
          
          # Replace template variables
          email_content="${template//\{\{name\}\}/${{ steps.extract-metadata.outputs.recipient_name }}}"
          email_content="${email_content//\{\{issue_number\}\}/${{ steps.extract-metadata.outputs.issue_number }}}"
          email_content="${email_content//\{\{issue_title\}\}/${{ steps.extract-metadata.outputs.issue_title }}}"
          email_content="${email_content//\{\{submission_date\}\}/${{ steps.extract-metadata.outputs.submission_date }}}"
          email_content="${email_content//\{\{closure_date\}\}/${{ steps.extract-metadata.outputs.closure_date }}}"
          email_content="${email_content//\{\{resolution_comment\}\}/${{ steps.extract-metadata.outputs.resolution_comment }}}"
          
          # Save the processed template to a temporary file
          echo "$email_content" > processed_template.html
          
          # Store the content in a way that preserves newlines for the next step
          echo "EMAIL_CONTENT<<EOF" >> $GITHUB_ENV
          cat processed_template.html >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Send closure email
        run: |
          # First, encode the HTML content to escape special characters
          ENCODED_HTML=$(echo "$EMAIL_CONTENT" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')
          
          # Create the JSON with the encoded HTML
          aws ses send-email \
            --from "support@projectairstorm.com" \
            --destination "ToAddresses=${{ steps.extract-metadata.outputs.recipient_email }}" \
            --message '{
              "Subject": {
                "Data": "[Project AirStorm Support] Ticket Closed: '"${{ steps.extract-metadata.outputs.issue_title }}"' [Issue: #'"${{ steps.extract-metadata.outputs.issue_number }}"']",
                "Charset": "UTF-8"
              },
              "Body": {
                "Html": {
                  "Data": '"$ENCODED_HTML"',
                  "Charset": "UTF-8"
                },
                "Text": {
                  "Data": "Dear '"${{ steps.extract-metadata.outputs.recipient_name }}"',\n\nYour feedback ticket has been resolved and closed. Thank you for helping us improve Project Airstorm!\n\nTicket Summary:\nReference #: '"${{ steps.extract-metadata.outputs.issue_number }}"'\nSubject: '"${{ steps.extract-metadata.outputs.issue_title }}"'\nSubmitted: '"${{ steps.extract-metadata.outputs.submission_date }}"'\nClosed: '"${{ steps.extract-metadata.outputs.closure_date }}"'\n\nResolution Notes:\n'"${{ steps.extract-metadata.outputs.resolution_comment }}"'\n\nWe appreciate your input and involvement in making Project Airstorm better. If you have any other feedback or concerns in the future, please don'\''t hesitate to reach out.\n\nBest regards,\nProject Airstorm Support Team",
                  "Charset": "UTF-8"
                }
              }
            }'
